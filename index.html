<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be Mine?</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --bg-color: #1a1a1a;
            --rose-primary: #e11d48;
            --rose-dark: #9f1239;
            --gold: #fbbf24;
            --paper: #fffcf0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at center, #2c2c2c 0%, #1a1a1a 100%);
        }

        /* Particles */
        .heart-particle {
            position: absolute;
            color: var(--rose-primary);
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 0 5px rgba(225, 29, 72, 0.5));
        }

        /* Container */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }

        /* The Box Design */
        .gift-box {
            position: relative;
            width: 200px;
            height: 200px;
            background: var(--rose-primary);
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.5s;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        .box-lid {
            position: absolute;
            top: -20px;
            left: -10px;
            width: 220px;
            height: 40px;
            background: var(--rose-dark);
            z-index: 10;
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .ribbon-v {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 100%;
            background: var(--gold);
        }

        .ribbon-h {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 40px;
            background: var(--gold);
        }

        /* Proposal Card */
        .card {
            position: absolute;
            width: 90%;
            max-width: 400px;
            background: var(--paper);
            padding: 40px 20px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            display: none;
            z-index: 50;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .card h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--rose-primary);
            font-size: 2.5rem;
            margin: 0 0 20px;
        }

        .card p {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
        }

        .btn {
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            transition: all 0.3s;
        }

        .btn-yes {
            background: var(--rose-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
        }

        .btn-no {
            background: #eee;
            color: #777;
        }

        /* Celebration Screen */
        #success-screen {
            display: none;
            color: white;
            text-align: center;
        }

        #success-screen h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--gold);
        }

        /* Audio Indicator */
        .audio-note {
            position: fixed;
            top: 20px;
            right: 20px;
            color: var(--gold);
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="audio-note" id="audio-status">♪ Audio ready</div>

    <div class="wrapper">
        <!-- Gift Box -->
        <div class="gift-box" id="mainBox">
            <div class="box-lid" id="lid">
                <div class="ribbon-v"></div>
            </div>
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
            <div style="position:absolute; bottom:-40px; color:var(--gold); width:100%; text-align:center;">
                TAP TO OPEN
            </div>
        </div>

        <!-- Proposal Card -->
        <div class="card" id="proposalCard">
            <h1>My Dearest,</h1>
            <p>Every moment with you is a treasure. I want to build a lifetime of memories by your side.</p>
            <h2 style="margin-bottom:30px;">Will you be mine?</h2>
            
            <div class="btn-group">
                <button class="btn btn-yes" id="yesBtn">YES! ❤️</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>

        <!-- Success Screen -->
        <div id="success-screen">
            <h1>Forever Starts Now!</h1>
            <p>I love you more than words can say.</p>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2021/07/Rainy-Day-Romantic-Piano-Music.mp3" type="audio/mpeg">
    </audio>

    <script>
        $(document).ready(function() {
            let noScale = 1;
            let yesScale = 1;
            const music = document.getElementById('bgMusic');

            // Open Box Animation
            $('#mainBox').on('click', function() {
                // Animate Lid
                $('#lid').css({
                    'transform': 'translateY(-150px) rotate(-15deg)',
                    'opacity': '0'
                });

                // Fade out box and show card
                setTimeout(() => {
                    $('#mainBox').fadeOut(500, function() {
                        $('#proposalCard').fadeIn(800).css('display', 'block');
                    });
                }, 300);

                // Play Music
                music.play().then(() => {
                    $('#audio-status').text('♪ Playing: Romantic Piano');
                }).catch(() => {
                    $('#audio-status').text('♪ Click anywhere for audio');
                });

                // Start heart particles
                startHearts();
            });

            // "No" Button Interaction
            $('#noBtn').on('click', function() {
                noScale -= 0.15;
                yesScale += 0.15;

                if (noScale <= 0.2) {
                    $(this).fadeOut(300);
                } else {
                    $(this).css('transform', `scale(${noScale})`);
                    $('#yesBtn').css('transform', `scale(${yesScale})`);
                }
            });

            // "Yes" Button Interaction
            $('#yesBtn').on('click', function() {
                $('#proposalCard').fadeOut(500, function() {
                    $('#success-screen').fadeIn(800);
                    celebrate();
                });
            });

            // Heart Particle Generator
            function startHearts() {
                setInterval(createHeart, 600);
            }

            function createHeart() {
                const heart = $('<div class="heart-particle">❤️</div>');
                const startX = Math.random() * 100;
                const size = Math.random() * 20 + 10;
                const duration = Math.random() * 3000 + 3000;

                heart.css({
                    'left': startX + 'vw',
                    'bottom': '-20px',
                    'font-size': size + 'px',
                    'opacity': Math.random()
                });

                $('body').append(heart);

                heart.animate({
                    'bottom': '110vh',
                    'left': (startX + (Math.random() * 20 - 10)) + 'vw',
                    'opacity': 0
                }, duration, 'linear', function() {
                    $(this).remove();
                });
            }

            function celebrate() {
                for(let i=0; i<50; i++) {
                    setTimeout(createHeart, i * 100);
                }
            }
        });
    </script>
</body>
</html>
